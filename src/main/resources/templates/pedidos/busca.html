<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Filtrar Pedidos')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <h1>Filtrar Pedidos</h1>

    <form class="row g-3 mb-4" th:action="@{/pedidos/filtro/resultados}" method="get">
        <div class="col-md-4">
            <label for="tipoFiltro" class="form-label">Tipo de Filtro</label>
            <select id="tipoFiltro" class="form-select" onchange="trocarFiltro()">
                <option value="">Selecione</option>
                <option value="cliente">Por Cliente</option>
                <option value="data">Por Data</option>
            </select>
        </div>

        <div id="filtroCliente" class="col-md-4 d-none">
            <label for="cliente" class="form-label">Cliente</label>
            <input type="text" class="form-control" id="cliente" name="cliente">
        </div>

        <div id="filtroData" class="row d-none">
            <div class="col-md-3">
                <label for="inicio" class="form-label">Data Inicial</label>
                <input type="date" class="form-control" id="inicio" name="inicio">
            </div>
            <div class="col-md-3">
                <label for="fim" class="form-label">Data Final</label>
                <input type="date" class="form-control" id="fim" name="fim">
            </div>
        </div>

        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Buscar</button>
        </div>
    </form>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div th:if="${pedidos != null}">
        <h4 th:text="|Total de Vendas: R$ ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}|"></h4>

        <table class="table table-bordered mt-3">
            <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Data</th>
                <th>Total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pedido : ${pedidos}">
                <td th:text="${pedido.id}"></td>
                <td th:text="${pedido.cliente}"></td>
                <td th:text="${pedido.data}"></td>
                <td th:text="${#numbers.formatDecimal(pedido.valorTotal, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            </tbody>
        </table>

        <a class="btn btn-danger mt-2"
           th:href="@{/pedidos/exportar-pdf(inicio=${#request.getParameter('inicio')}, fim=${#request.getParameter('fim')})}">
            Exportar PDF
        </a>
    </div>
</main>

<div class="mt-auto" th:replace="~{fragments/footer :: footer}"></div>

<script>
    function trocarFiltro() {
        const tipo = document.getElementById('tipoFiltro').value;
        document.getElementById('filtroCliente').classList.add('d-none');
        document.getElementById('filtroData').classList.add('d-none');

        if (tipo === 'cliente') {
            document.getElementById('filtroCliente').classList.remove('d-none');
        } else if (tipo === 'data') {
            document.getElementById('filtroData').classList.remove('d-none');
        }
    }
</script>

</body>
</html>

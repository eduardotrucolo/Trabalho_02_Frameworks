<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('Produtos')}"></div>

<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow-1">
    <div class="container py-4">
    <h1>Produtos</h1>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center gap-2 mb-3">
                <a class="btn btn-success" href="/produtos/novo">Novo Produto</a>
                <a class="btn btn-primary" href="/produtos/exportar-pdf">Exportar Produtos (PDF)</a>
                <a class="btn btn-secondary" href="/produtos/buscar-por-preco">Buscar por Preço</a>
            </div>

        </div>

        <table class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Categoria</th>
                <th>Fornecedores</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="produto : ${produtos}">
                <td th:text="${produto.id}"></td>
                <td th:text="${produto.nome}"></td>
                <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${produto.categoria != null ? produto.categoria.nome : 'Sem categoria'}"></td>
                <td>
                    <span th:if="${#lists.isEmpty(produto.fornecedores)}">Nenhum</span>
                    <span th:if="${!#lists.isEmpty(produto.fornecedores)}"
                          th:each="f, iter : ${produto.fornecedores}"
                          th:text="${f.nome + (iter.last ? '' : ', ')}"></span>
                </td>
                <td>
                    <a th:href="@{'/produtos/editar/' + ${produto.id}}" class="btn btn-primary btn-sm">Editar</a>
                    <a th:href="@{'/produtos/excluir/' + ${produto.id}}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Tem certeza que deseja excluir?')">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
        <nav>
            <ul class="pagination justify-content-center">
                <!-- Primeira Página -->
                <li class="page-item" th:classappend="${produtos.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/produtos(page=0)}">&laquo;&laquo;</a>
                </li>

                <!-- Página Anterior -->
                <li class="page-item" th:classappend="${produtos.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/produtos(page=${produtos.number - 1})}">&laquo;</a>
                </li>

                <!-- Páginas em volta da atual -->
                <li class="page-item" th:each="i : ${#numbers.sequence(
            T(java.lang.Math).max(0, produtos.number - 2),
            T(java.lang.Math).min(produtos.totalPages - 1, produtos.number + 2)
        )}"
                    th:classappend="${i == produtos.number} ? 'active'">
                    <a class="page-link" th:href="@{/produtos(page=${i})}" th:text="${i + 1}"></a>
                </li>

                <!-- Página Seguinte -->
                <li class="page-item" th:classappend="${produtos.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/produtos(page=${produtos.number + 1})}">&raquo;</a>
                </li>

                <!-- Última Página -->
                <li class="page-item" th:classappend="${produtos.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/produtos(page=${produtos.totalPages - 1})}">&raquo;&raquo;</a>
                </li>
            </ul>
        </nav>


    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>


<div class="mt-auto" th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="fragments/head :: head('Categorias')"></div>

<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-grow-1">
    <div class="container py-4">
    <h1>Categorias</h1>
        <div class="d-flex flex-wrap gap-2 mb-3">
            <a class="btn btn-success" href="/categorias/nova">Nova Categoria</a>
            <a class="btn btn-primary" href="/categorias/exportar-pdf">Exportar Categorias (PDF)</a>
            <a class="btn btn-secondary" href="/categorias/contar-produtos">Contar Produtos por Categoria</a>
        </div>


        <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.id}"></td>
            <td th:text="${categoria.nome}"></td>
            <td>
                <a th:href="@{'/categorias/editar/' + ${categoria.id}}" class="btn btn-primary btn-sm">Editar</a>
                <a th:href="@{'/categorias/excluir/' + ${categoria.id}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Tem certeza que deseja excluir?')">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</main>

<div class="mt-auto" th:replace="fragments/footer :: footer"></div>
</body>
</html>

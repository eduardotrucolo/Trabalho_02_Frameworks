<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="fragments/head :: head('Fornecedores')"></div>

<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="flex-grow-1">
    <div class="container py-4">
    <h1>Fornecedores</h1>
        <div class="d-flex flex-wrap gap-2 mb-3">
            <a class="btn btn-success" href="/fornecedores/novo">Novo Fornecedor</a>
            <a class="btn btn-primary" href="/fornecedores/exportar-pdf">Exportar Fornecedores (PDF)</a>
            <a class="btn btn-secondary" href="/fornecedores/contar-produtos">Contar Produtos por Fornecedor</a>
        </div>

        <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CNPJ</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${fornecedores}">
            <td th:text="${f.id}"></td>
            <td th:text="${f.nome}"></td>
            <td th:text="${f.cnpj}"></td>
            <td>
                <a th:href="@{'/fornecedores/editar/' + ${f.id}}" class="btn btn-primary btn-sm">Editar</a>
                <a th:href="@{'/fornecedores/excluir/' + ${f.id}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Tem certeza que deseja excluir?')">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</main>

<div class="mt-auto" th:replace="fragments/footer :: footer"></div>
</body>
</html>

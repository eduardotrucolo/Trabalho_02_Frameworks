<!-- templates/cardapio/form.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Formulário Cardápio')"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container py-4">
    <h1 th:text="${item.id != null} ? 'Editar Item' : 'Novo Item'"></h1>

    <form th:action="@{/cardapio/salvar}" th:object="${item}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control" id="nome" required>
        </div>

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <textarea th:field="*{descricao}" class="form-control" id="descricao" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label for="preco" class="form-label">Preço</label>
            <input type="number" step="0.01" th:field="*{preco}" class="form-control" id="preco" required>
        </div>

        <div class="mb-3">
            <label for="categoria" class="form-label">Categoria</label>
            <select th:field="*{categoria}" class="form-select" id="categoria" required>
                <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}">Categoria</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a class="btn btn-secondary" th:href="@{/cardapio}">Cancelar</a>
    </form>
</main>

<div class="mt-auto" th:replace="fragments/footer :: footer"></div>
</body>
</html>
